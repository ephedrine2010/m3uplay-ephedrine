<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M3U Playlist Manager</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/trends_board.css" />
    <link rel="stylesheet" href="js/yt-channels/style.css" />
    <link rel="stylesheet" href="css/apple.css" />

    <!-- Installable app (Add to Home screen) -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <script src="https://w.soundcloud.com/player/api.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

    <!-- ===== Sign-in screen ===== -->
    <section id="signin-box">
        <div class="signin-card">
            <div class="signin-logo" data-icon="music" aria-hidden="true"></div>
            <h1>M3U Player</h1>
            <p>Your playlists, anywhere. Sign in to start.</p>
            <button id="signin-btn" class="google-btn">
                <svg class="g-icon" viewBox="0 0 18 18" width="20" height="20" aria-hidden="true">
                    <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
                    <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
                    <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
                </svg>
                <span>Sign in with Google</span>
            </button>
        </div>
    </section>

    <!-- ===== Main app (3-pane + player bar) ===== -->
    <div id="app" class="hidden">

        <header id="topbar">
            <div class="tb-left">
                <button id="library-toggle" class="icon-btn" title="Open library" aria-label="Open library" aria-controls="sidebar" aria-expanded="false" data-icon="menu"></button>
                <h1 id="page-title">Home</h1>
            </div>
            <div class="tb-center">
                <button id="play-all-btn" class="ghost hidden" data-icon="play" data-label="Play all">Play all</button>
                <button id="add-song-btn" class="ghost hidden" data-icon="plus" data-label="Add track">Add track</button>
                <button id="download-btn" class="ghost hidden" data-icon="download" data-label="Download">Download</button>
            </div>
            <div class="tb-right">
                <button id="theme-toggle" class="icon-btn" title="Switch appearance" aria-label="Switch appearance" data-icon="moon"></button>
                <div id="home-actions"></div>
            </div>
        </header>

        <main id="panes">
            <!-- Left: playlists -->
            <aside id="sidebar">
                <div class="sidebar-brand">
                    <button id="brand" class="brand" title="Home" data-icon="music" data-label="M3U Player">M3U Player</button>
                    <button id="library-close" class="icon-btn" title="Close library" aria-label="Close library" data-icon="x"></button>
                </div>
                <button id="home-btn" class="sidebar-home" data-icon="home" data-label="Home" aria-current="page">Home</button>
                <div id="sidebar-head">
                    <h2>Playlists</h2>
                    <span class="spacer"></span>
                    <button id="new-pl-btn" class="icon-btn" title="New playlist" aria-label="New playlist" data-icon="plus"></button>
                </div>
                <ul id="playlist-list"></ul>
                <button id="import-btn" class="sidebar-import" data-icon="upload" data-label="Import playlist">Import playlist</button>
                <input id="import-file" type="file" accept=".m3u,.m3u8,audio/x-mpegurl,audio/mpegurl" class="hidden" />
                <div class="sidebar-account"><span class="account-avatar" id="account-avatar" aria-hidden="true">M</span><div class="account-copy"><strong>Your library</strong><span id="user-email"></span></div><button id="signout-btn" class="icon-btn" title="Sign out" aria-label="Sign out" data-icon="signout"></button></div>
            </aside>

            <!-- Right: tracks of selected playlist -->
            <section id="content">
                <ul id="track-list"></ul>
            </section>
        </main>
        <button id="library-scrim" aria-label="Close library" tabindex="-1" hidden></button>

        <!-- Bottom: player bar -->
        <footer id="player-bar">
            <div class="player-art" aria-hidden="true"><span data-icon="music"></span><div id="viz" class="viz">
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
            </div></div>
            <div id="now-playing">Nothing playing</div>
            <button id="player-toggle" class="ghost hidden" type="button" aria-label="Pause playback">Pause</button>
            <audio id="audio" controls preload="none"></audio>
            <iframe id="sc-widget" allow="autoplay" hidden></iframe>
            <!-- YouTube: the IFrame API replaces #yt-player with an <iframe>.
                 #yt-toggle collapses the video to audio-only (keeps playing). -->
            <div id="yt-widget" hidden>
                <div id="yt-player"></div>
                <button id="yt-toggle" type="button" title="Hide video">▾ Hide</button>
            </div>
        </footer>

        <!-- New-playlist popup -->
        <dialog id="new-pl-modal" class="modal-overlay" aria-labelledby="new-playlist-title">
            <div class="modal">
                <h3 id="new-playlist-title">New playlist</h3>
                <label for="new-name">Playlist name</label>
                <input id="new-name" placeholder="My playlist" />
                <div class="modal-actions">
                    <button id="new-pl-cancel" class="ghost">Cancel</button>
                    <button id="new-pl-create">Create</button>
                </div>
            </div>
        </dialog>

        <!-- Add-song popup -->
        <dialog id="add-song-modal" class="modal-overlay" aria-labelledby="add-track-title">
            <div class="modal">
                <h3 id="add-track-title">Add track</h3>
                <label for="add-url">Audio, SoundCloud or YouTube link</label>
                <input id="add-url" placeholder="https://…/song.mp3 · soundcloud.com/… · youtube.com/…" />
                <label for="add-name">Name (optional)</label>
                <input id="add-name" placeholder="Name (optional)" />
                <div class="modal-actions">
                    <button id="add-song-done" class="ghost">Done</button>
                    <button id="add-track-btn">Add</button>
                </div>
            </div>
        </dialog>

        <!-- Confirm popup (reusable) -->
        <dialog id="confirm-modal" class="modal-overlay" aria-labelledby="confirm-text">
            <div class="modal">
                <h3 id="confirm-text">Are you sure?</h3>
                <div class="modal-actions">
                    <button id="confirm-cancel" class="ghost">Cancel</button>
                    <button id="confirm-ok" class="danger">Remove</button>
                </div>
            </div>
        </dialog>

    </div>

    <p id="status" role="status" aria-live="polite"></p>

    <script type="module" src="js/app.js"></script>
</body>
</html>
